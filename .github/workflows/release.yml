name: Release PDFs

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish PDFs
    runs-on: ubuntu-latest

    env:
      LIBERTINUS_URL: https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.tar.zst
      NOTO_SANS_CJK_URL: https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/03_NotoSansCJK-OTC.zip
      NOTO_SERIF_CJK_URL: https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/04_NotoSerifCJKOTC.zip
      FONT_DIR: .release-fonts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd unzip

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"

      - name: Download fonts
        run: |
          mkdir -p "$FONT_DIR" "$RUNNER_TEMP/font-src/libertinus" "$RUNNER_TEMP/font-src/noto-sans-cjk" "$RUNNER_TEMP/font-src/noto-serif-cjk"

          curl -fsSL "$LIBERTINUS_URL" -o "$RUNNER_TEMP/Libertinus-7.051.tar.zst"
          curl -fsSL "$NOTO_SANS_CJK_URL" -o "$RUNNER_TEMP/NotoSansCJK-OTC.zip"
          curl -fsSL "$NOTO_SERIF_CJK_URL" -o "$RUNNER_TEMP/NotoSerifCJKOTC.zip"

          tar --zstd -xf "$RUNNER_TEMP/Libertinus-7.051.tar.zst" -C "$RUNNER_TEMP/font-src/libertinus"
          unzip -oq "$RUNNER_TEMP/NotoSansCJK-OTC.zip" -d "$RUNNER_TEMP/font-src/noto-sans-cjk"
          unzip -oq "$RUNNER_TEMP/NotoSerifCJKOTC.zip" -d "$RUNNER_TEMP/font-src/noto-serif-cjk"

          find "$RUNNER_TEMP/font-src" -type f \
            \( -iname "*.otf" -o -iname "*.ttf" -o -iname "*.otc" -o -iname "*.ttc" \) \
            -exec cp {} "$FONT_DIR"/ \;

          find "$FONT_DIR" -maxdepth 1 -type f -print | sort

      - name: Build PDFs
        run: |
          typst compile --font-path "$FONT_DIR" guideline_zh.typ guideline_zh.pdf
          typst compile --font-path "$FONT_DIR" guideline_en.typ guideline_en.pdf

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            guideline_zh.pdf
            guideline_en.pdf
          fail_on_unmatched_files: true
          generate_release_notes: true
